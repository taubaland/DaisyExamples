# Load a BOOT_SRAM build straight into SRAM over the ST-Link, without writing
# QSPI. Invoked by `./flash.sh sram`.
#
# Lifted from boonta/MultiEffect/sram-load.cfg, which was worked out against
# the libDaisy build. It applies unchanged here: the hazard it avoids is in the
# bootloader, not in the app.
#
# The trick is *where* you take control. Halting the bootloader at a time of
# your own choosing and forcing PC/SP does not work -- it is usually inside a
# USB interrupt, so the app's first stack pop returns from an exception that is
# still active and bus-faults off the top of DTCMRAM.
#
# So: let the bootloader do the whole handover, and catch the app on its first
# instruction with a hardware breakpoint. At that point the core is in Thread
# mode, MSP and VTOR are already right, and the clocks are up. Overwrite the
# image beneath it, put PC back, and go.
#
# One difference from the libDaisy build worth knowing: DaisyDuino's
# System::Init calls ConfigureClocks() unconditionally, where libDaisy's skips
# it when no bootloader is present. So this image does not depend on the
# bootloader for its clocks -- only for the handover.
#
# Requires: the Daisy bootloader in internal flash, and *some* valid app in
# QSPI so the bootloader actually jumps. Both are one-time.
#
# Expects APP_ELF and APP_ENTRY to be set by the caller.

init

# An ELF entry point for Thumb code has bit 0 set -- readelf reports
# 0x24000a09 for an entry at 0x24000a08. Cortex-M refuses an odd PC, and
# openocd reports it only as "Error setting register pc", which is easy to read
# past when the breakpoint happens to have left PC in the right place anyway.
set APP_ENTRY [expr {$APP_ENTRY & 0xfffffffe}]

# What the bootloader will jump to -- which is not the new ELF's entry. The two
# differ whenever a code change moves Reset_Handler, and it is the *old* entry
# we have to break on.
#
# The authority on it is the reset vector of the image resident in QSPI, since
# that word is literally what the bootloader loads into PC. It is right for
# both kinds of resident image: a BOOT_SRAM one pointing into 0x240xxxxx and a
# BOOT_QSPI one pointing into 0x900400xx.
#
# It cannot simply be read, though. QSPI is only mapped at 0x90000000 while
# something has configured the peripheral -- true inside the bootloader's
# window and again once an app has run its own init, false the rest of the
# time, including right after a debugger attaches to a board sitting at an
# openocd-loaded image.
#
# Nor can the copy at 0x24000004 stand in for it, which is what this script
# used to read. That is the image *openocd* last loaded, not the one the
# bootloader is about to load over the top of it, and the two are different
# programs with different entry points as soon as this script has been run
# once against a different build.
#
# So: let the board run, halt it repeatedly until QSPI answers, and read the
# vector then. That costs a reset of its own, which is why it is a pass
# separate from the one that catches the jump. Halting the bootloader is only
# dangerous if you then force PC and SP, as above; this reads a word and
# resumes.
#
# Kept in step with ../QspiWriter/qspi-write.cfg, which has to solve exactly
# the same problem.
proc find_catch_pc {} {
    reset run
    for {set i 0} {$i < 24} {incr i} {
        sleep 200
        halt
        if {![catch {set v [mrw 0x90040004]}]} {
            set v [expr {$v & 0xfffffffe}]
            if {($v >= 0x24000000 && $v < 0x24078000)
                || ($v >= 0x90040000 && $v < 0x90800000)} {
                return $v
            }
        }
        resume
    }
    return 0
}

set catch_pc [find_catch_pc]
if {$catch_pc == 0} {
    echo "QSPI never answered; breaking on the new entry instead"
    set catch_pc $APP_ENTRY
}
echo [format "catching the bootloader's jump at 0x%08x" $catch_pc]

bp $catch_pc 2 hw
reset run

# Generous: the bootloader has a DFU window to sit through before it jumps.
if {[catch {wait_halt 8000} err]} {
    rbp $catch_pc
    echo "-------------------------------------------------------------------"
    echo "Never reached the app entry. Either there is no valid app in QSPI"
    echo "for the bootloader to jump to (flash one once with './flash.sh"
    echo "BOOT_QSPI'), or the resident image's entry point has moved. Retrying"
    echo "once usually fixes the second case, since the entry is re-read each run."
    echo "-------------------------------------------------------------------"
    shutdown error
}

rbp $catch_pc

load_image $APP_ELF
verify_image $APP_ELF

# VTOR is already 0x24000000 from the bootloader's jump and the FPU is already
# enabled, so __wrap_SystemInit in BootApp.cpp has nothing left to do on this
# path -- it still matters on a real boot, where nothing has run in between.
reg pc $APP_ENTRY
resume

echo "running from SRAM"
shutdown
