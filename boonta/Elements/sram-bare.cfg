# Run a BOOT_SRAM build on a board with no bootloader in internal flash and
# nothing of ours in QSPI. Invoked by `make sram-bare`. Writes no flash.
#
# sram-load.cfg lets the Daisy bootloader do the handover and catches the app
# on its first instruction. With no bootloader there is no handover to catch,
# so this does the bootloader's job instead -- which sram-load.cfg warns
# against, for a reason that does not apply here: it is forcing PC and SP on
# a bootloader halted mid-interrupt that goes wrong. A core halted *at reset*
# is in Thread mode with nothing pending, and there is nothing to unwind.
#
# What a BOOT_SRAM image expects to find already done, and why:
#
#   FPU on             startup skips SystemInit() under -DBOOT_APP, and that
#                      is where CPACR is normally written
#   D2 SRAM clocks on  also SystemInit(). libDaisy's DMA buffers and the heap
#                      are there, and with the clocks off the first write
#                      raises an imprecise bus fault some way from its cause
#   boot_info.version  in backup SRAM. DaisySeed::Init reads it, and if it
#                      finds 0 (LT_v6_0) it believes an old bootloader has
#                      set the clocks up and leaves the core on HSI
#   VTOR, MSP          the image's own
#
# Then the sample tables. Samples::Load() looks for them in QSPI, finds
# nothing, and zeroes its stretch of SDRAM; once it has, they are loaded over
# the top from here and samples::loaded is set by hand.
#
# Expects APP_ELF, SAMPLES_BIN, SAMPLES_SDRAM and SAMPLES_LOADED.

init
reset halt

mww 0xE000ED88 0x00F00000                               ;# CPACR: FPU on
mww 0x580244DC [expr {[mrw 0x580244DC] | 0xE0000000}]   ;# RCC_AHB2ENR: D2 SRAM
mww 0x580244E0 [expr {[mrw 0x580244E0] | 0x10000000}]   ;# RCC_AHB4ENR: BKPRAM
mww 0x58024800 [expr {[mrw 0x58024800] | 0x100}]        ;# PWR_CR1.DBP
mww 0x38800008 3                                        ;# boot_info.version = v6_1

load_image $APP_ELF
verify_image $APP_ELF

mww 0xE000ED08 0x24000000                               ;# VTOR
reg msp [mrw 0x24000000]
reg pc [expr {[mrw 0x24000004] & 0xfffffffe}]
resume

# Long enough for main() to have brought SDRAM up and run Samples::Load().
sleep 1500
halt

set cfsr [mrw 0xE000ED28]
set hfsr [mrw 0xE000ED2C]
if {$cfsr != 0 || $hfsr != 0} {
    echo [format "faulted during boot: CFSR %08x HFSR %08x" $cfsr $hfsr]
    shutdown error
}

# The blob is a 16-byte header and then the payload; put the payload at
# SAMPLES_SDRAM by starting the file sixteen bytes below it.
load_image $SAMPLES_BIN [expr {$SAMPLES_SDRAM - 16}] bin
mww $SAMPLES_LOADED 1
resume

echo "running from SRAM, samples in SDRAM"
shutdown
