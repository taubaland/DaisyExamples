# Drive QspiWriter from the host. Invoked by qspi-write.sh, which works out
# every address in here from the ELF and splits the payload into chunk files.
#
# Expects, from the caller:
#   WRITER_ELF     the built QspiWriter.elf (a Windows path -- openocd is a
#                  native binary and does not understand /d/...)
#   WRITER_ENTRY   its entry point, from readelf
#   MB             address of g_mailbox
#   RDY            address of QspiWriterReady
#   DEST           QSPI address to write at, e.g. 0x90040000
#   SPAN           bytes to erase (the payload, rounded up to a 4K sector)
#   CHUNK          bytes per chunk (must match kChunkBytes)
#   NCHUNKS        how many chunk files there are
#   CHUNK_FMT      a format string taking the chunk index, e.g. ".../chunk%03d"
#
# The structure is: catch the bootloader's handover, overwrite SRAM with the
# writer, then talk to it through a breakpoint on QspiWriterReady(). Every
# exchange is halt / write mailbox / resume, so nothing depends on reading a
# running target -- which over ST-Link's HLA transport is the part that is not
# dependable.

init

# --- mailbox layout, from QspiWriter.h -------------------------------------
set MB_MAGIC   [expr {$MB + 0}]
set MB_COMMAND [expr {$MB + 4}]
set MB_ADDRESS [expr {$MB + 8}]
set MB_SIZE    [expr {$MB + 12}]
set MB_STATUS  [expr {$MB + 16}]
set MB_DETAIL  [expr {$MB + 20}]
set MB_DATA    [expr {$MB + 32}]

set MAGIC_REQ 0x51575231

set CMD_ERASE 1
set CMD_WRITE 2
set CMD_DONE  3

set ST_READY 1

array set ST_NAME {
    1 "ready"
    2 "busy"
    3 "ok"
    4 "QSPI driver error"
    5 "verify mismatch"
    6 "unknown command"
    7 "address or size out of range"
}

proc status_name {s} {
    global ST_NAME
    if {[info exists ST_NAME($s)]} { return $ST_NAME($s) }
    return [format "unknown status %d" $s]
}

# --- get the writer running ------------------------------------------------

# An ELF entry point for Thumb code has bit 0 set, and Cortex-M refuses an odd
# PC. openocd reports that only as "Error setting register pc", which is easy
# to read past.
set WRITER_ENTRY [expr {$WRITER_ENTRY & 0xfffffffe}]

# Where the bootloader is about to jump. The authority on that is the reset
# vector of the image resident in QSPI: that word is literally what the
# bootloader loads into PC, and it is right for both kinds of resident image --
# a BOOT_SRAM one pointing into 0x240xxxxx and a BOOT_QSPI one pointing into
# 0x900400xx.
#
# It cannot simply be read, though. QSPI is only mapped at 0x90000000 while
# something has configured the peripheral, which is true inside the
# bootloader's window and again once the resident app has run its own
# DaisySeed::Init, and false the rest of the time -- including right after a
# debugger attaches to a board sitting at an openocd-loaded image, which is the
# normal state of this board.
#
# Nor can the copy at 0x24000004 stand in for it. That is the image *openocd*
# last loaded, not the one the bootloader is about to load over the top of it,
# and those are different programs with different entry points the moment this
# script or ./flash.sh sram has been run once.
#
# So: let the board run, halt it repeatedly until QSPI answers, and read the
# vector then. This costs a reset of its own, which is why it is a separate
# pass from the one that catches the jump. Halting the bootloader is only
# dangerous if you then force PC and SP -- see sram-load.cfg -- and this does
# not; it reads a word and resumes.
proc find_catch_pc {} {
    reset run
    for {set i 0} {$i < 24} {incr i} {
        sleep 200
        halt
        if {![catch {set v [mrw 0x90040004]}]} {
            set v [expr {$v & 0xfffffffe}]
            if {($v >= 0x24000000 && $v < 0x24078000)
                || ($v >= 0x90040000 && $v < 0x90800000)} {
                return $v
            }
        }
        resume
    }
    return 0
}

set catch_pc [find_catch_pc]
if {$catch_pc == 0} {
    echo "-------------------------------------------------------------------"
    echo "Could not read a reset vector out of QSPI at 0x90040004, in five"
    echo "seconds of trying across a reset. Either QSPI holds no app, or"
    echo "nothing on the board ever configures the QSPI peripheral -- the"
    echo "bootloader does so in its window, and a libDaisy app does so in"
    echo "DaisySeed::Init, so getting here means neither ran."
    echo "-------------------------------------------------------------------"
    shutdown error
}
echo [format "catching the bootloader's jump at 0x%08x" $catch_pc]

bp $catch_pc 2 hw
reset run

# Generous: the bootloader sits in its DFU window before it jumps.
if {[catch {wait_halt 8000} err]} {
    rbp $catch_pc
    echo "-------------------------------------------------------------------"
    echo "Never reached the resident app's entry, so there was nothing to"
    echo "catch. Either QSPI holds no valid app for the bootloader to jump to,"
    echo "or the bootloader is not in internal flash at all. Both are fixed by"
    echo "../NewEffectDuino/flash.sh boot, and the first by any one successful"
    echo "run of this script."
    echo "-------------------------------------------------------------------"
    shutdown error
}
rbp $catch_pc

load_image $WRITER_ELF
verify_image $WRITER_ELF
reg pc $WRITER_ENTRY

# From here on the writer stops at QspiWriterReady() whenever it wants work.
bp $RDY 2 hw

# Resume, wait for the writer to come back to the breakpoint, and return what
# it put in the mailbox.
proc step_writer {what timeout} {
    global MB_STATUS MB_DETAIL RDY
    resume
    if {[catch {wait_halt $timeout} err]} {
        echo "the writer never came back from: $what"
        rbp $RDY
        shutdown error
    }
    set status [mrw $MB_STATUS]
    set detail [mrw $MB_DETAIL]
    if {$status != 3 && $status != 1} {
        echo [format "%s failed: %s (detail 0x%08x)" $what [status_name $status] $detail]
        rbp $RDY
        shutdown error
    }
    return $status
}

proc post {cmd addr size} {
    global MB_MAGIC MB_COMMAND MB_ADDRESS MB_SIZE MB_STATUS MAGIC_REQ
    mww $MB_COMMAND $cmd
    mww $MB_ADDRESS $addr
    mww $MB_SIZE $size
    # Clear the previous result so a stale "ok" cannot be mistaken for this
    # command's. The writer sets busy itself as well; this just closes the gap
    # between the resume and its first instruction.
    mww $MB_STATUS 2
    # Magic last, and only once the rest of the command is in place.
    mww $MB_MAGIC $MAGIC_REQ
}

# The writer's first stop is the handshake: it is up, and the QSPI is
# initialised. Nothing has been posted yet, so this is the one step_writer that
# expects "ready" rather than "ok".
set s [step_writer "writer startup" 5000]
if {$s != $ST_READY} {
    echo [format "writer came up in an unexpected state: %s" [status_name $s]]
    rbp $RDY
    shutdown error
}
echo "writer is up"

# --- erase -----------------------------------------------------------------
echo [format "erasing 0x%08x + %d bytes" $DEST $SPAN]
post $CMD_ERASE $DEST $SPAN
# 4K sectors at up to 300ms each, and a whole app's worth of them.
step_writer "erase" 60000

# --- write -----------------------------------------------------------------
for {set i 0} {$i < $NCHUNKS} {incr i} {
    set f [format $CHUNK_FMT $i]
    set n [file size $f]
    set a [expr {$DEST + $i * $CHUNK}]
    echo [format "chunk %d/%d: %d bytes -> 0x%08x" [expr {$i + 1}] $NCHUNKS $n $a]
    load_image $f $MB_DATA bin
    post $CMD_WRITE $a $n
    step_writer [format "chunk %d" $i] 30000
}

# --- finish ----------------------------------------------------------------
post $CMD_DONE 0 0
step_writer "finish" 5000
rbp $RDY

# Leave it running rather than halted, so the LED has something to say.
resume

echo "written and verified; the board is blinking slowly. Power-cycle to run it."
shutdown
