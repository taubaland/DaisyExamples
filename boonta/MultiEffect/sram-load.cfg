# Load a BOOT_SRAM build straight into SRAM over the ST-Link, without writing
# QSPI. Invoked by `make sram`; see the README for why this exists.
#
# The trick is *where* you take control. A BOOT_SRAM image is not
# self-contained: DaisySeed::Init only configures the clocks when it can see a
# bootloader (`boot_info.version` in backup SRAM), and the bootloader is also
# what sets VTOR and hands over in Thread mode. Halting the bootloader at a
# time of your own choosing and forcing PC/SP does not work -- it is usually
# inside a USB interrupt, so the app's first stack pop returns from an
# exception that is still active and bus-faults off the top of DTCMRAM.
#
# So: let the bootloader do the whole handover, and catch the app on its first
# instruction with a hardware breakpoint. At that point the core is in Thread
# mode, MSP and VTOR are already right, and the clocks are up. Overwrite the
# image beneath it, put PC back, and go.
#
# Requires: the Daisy bootloader in internal flash, and *some* valid app in
# QSPI so the bootloader actually jumps. Both are one-time.
#
# Expects APP_ELF and APP_ENTRY to be set by the caller.

init

# An ELF entry point for Thumb code has bit 0 set -- readelf reports
# 0x24000a09 for an entry at 0x24000a08. Cortex-M refuses an odd PC, and
# openocd reports it only as "Error setting register pc", which is easy to read
# past when the breakpoint happens to have left PC in the right place anyway.
set APP_ENTRY [expr {$APP_ENTRY & 0xfffffffe}]

# What the bootloader will jump to. Read the reset vector out of the image
# currently resident in SRAM rather than trusting the new ELF's entry: the two
# differ whenever a code change moves Reset_Handler, and it is the *old* entry
# we have to break on. Falls back to the new ELF's entry on a cold start, when
# SRAM holds nothing meaningful.
set catch_pc [expr {[mrw 0x24000004] & 0xfffffffe}]
if {$catch_pc < 0x24000000 || $catch_pc >= 0x24078000} {
    echo "SRAM holds no valid image yet; breaking on the new entry instead"
    set catch_pc $APP_ENTRY
}
echo [format "catching the bootloader's jump at 0x%08x" $catch_pc]

bp $catch_pc 2 hw
reset run

# Generous: the bootloader has a DFU window to sit through before it jumps.
if {[catch {wait_halt 8000} err]} {
    rbp $catch_pc
    echo "-------------------------------------------------------------------"
    echo "Never reached the app entry. Either there is no valid app in QSPI"
    echo "for the bootloader to jump to (flash one once with 'make program-dfu'),"
    echo "or the resident image's entry point has moved. Retrying once usually"
    echo "fixes the second case, since the entry is re-read each run."
    echo "-------------------------------------------------------------------"
    shutdown error
}

rbp $catch_pc

load_image $APP_ELF
verify_image $APP_ELF

# VTOR is already 0x24000000 from the bootloader's jump, and the FPU is already
# enabled -- both are set before we get here, which is the whole point of
# catching the handover rather than staging it ourselves.
reg pc $APP_ENTRY
resume

echo "running from SRAM"
shutdown
